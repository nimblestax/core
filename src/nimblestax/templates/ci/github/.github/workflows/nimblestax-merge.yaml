name: Nimblestax merge

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # Identity federation: no long-lived secret sits in CI.

env:
  NIMBLESTAX_SPEC: ${{ vars.NIMBLESTAX_SPEC || 'nimblestax==NIMBLESTAX_VERSION' }}
  DATABRICKS_AUTH_TYPE: github-oidc
  DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}

jobs:
  # One Build Package of this commit. Every Environment is deployed from it, never rebuilt.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx --from "$NIMBLESTAX_SPEC" nsx validate
      - run: uvx --from "$NIMBLESTAX_SPEC" nsx compile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nimblestax-package
          path: build

  deploy-dev:
    needs: package
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nimblestax-package
          path: build
      - run: uvx --from "$NIMBLESTAX_SPEC" nsx validate --platform --env dev
      - run: uvx --from "$NIMBLESTAX_SPEC" nsx deploy --env dev --package build
