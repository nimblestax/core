# yaml-language-server: $schema=.nimblestax/schemas/platform.v3.json
kind: platform
version: 3
name: kettle
environments:
  dev:
    host: https://your-workspace.cloud.databricks.com
    role: development
naming:
  # Where tables live, and how you write a table's name. The sales Domain's silver orders
  # in prod, under each Naming Style:
  #   system-and-domain-catalogs  prod_sales.silver.orders    written sales.silver.orders
  #   layer-catalogs              prod_silver.sales.orders    written silver.sales.orders
  #   environment-catalogs        prod.sales_silver.orders    written sales_silver.orders
  # How names resolve in each Environment: https://nimblestax.com/docs/concepts/naming
  style: system-and-domain-catalogs
  layers:
    models: [gold]
domains:
  - sales
  - finance
  - shared
